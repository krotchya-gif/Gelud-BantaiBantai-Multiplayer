services:
  game-server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3200
      GAME_ORIGIN: ${GAME_ORIGIN}
      TICK_RATE: ${TICK_RATE:-30}
      SNAPSHOT_RATE: ${SNAPSHOT_RATE:-15}
      MAX_CATCHUP_STEPS: ${MAX_CATCHUP_STEPS:-5}
      SERVER_BOTS: ${SERVER_BOTS:-0}
      MAX_PLAYERS_PER_ROOM: ${MAX_PLAYERS_PER_ROOM:-8}
      ROOM_IDLE_TTL_SECONDS: ${ROOM_IDLE_TTL_SECONDS:-60}
      RECONNECT_GRACE_SECONDS: ${RECONNECT_GRACE_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
